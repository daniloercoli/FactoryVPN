name: factoryvpn

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.portal
      args:
        APP_NAME: ${APP_NAME-FactoryVPN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/https:/etc/nginx/ssl:ro
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/factory/allow.conf:/etc/nginx/factory-allow.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        APP_NAME: ${APP_NAME-FactoryVPN}
    user: "${FACTORYVPN_UID:-1000}:${FACTORYVPN_GID:-1000}"
    volumes:
      - ./.backup-control:/backup-control
      - ./.backups:/backups:ro
      # Public certificates only. Recreate API after atomically replacing a PEM.
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/https/cert.pem:/status-certificates/https.pem:ro
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/server/server.crt:/status-certificates/openvpn.pem:ro
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/server/ca.crt:/status-certificates/openvpn-ca.pem:ro
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/pki-public:/status-pki/pki-public:ro
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/crls:/status-pki/crls:ro
    environment:
      STATUS_HTTPS_CERTIFICATE_FILE: /status-certificates/https.pem
      STATUS_VPN_CERTIFICATE_FILE: /status-certificates/openvpn.pem
      STATUS_VPN_CA_FILE: /status-certificates/openvpn-ca.pem
      STATUS_PKI_ROOT: /status-pki
      BACKUP_CONTROL_DIR: /backup-control
      BACKUP_ARCHIVE_DIR: /backups
      BACKUP_MAX_BYTES: ${BACKUP_MAX_BYTES:-536870912}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_CA_FILE: ${SMTP_CA_FILE:-}
      EMAIL_CODE_KEY: ${EMAIL_CODE_KEY:?Generate secrets with scripts.bootstrap}
      DATABASE_URL: postgresql+asyncpg://factoryvpn:${POSTGRES_PASSWORD:?Generate secrets with scripts.bootstrap}@db:5432/factoryvpn
      JWT_SECRET: ${JWT_SECRET:?Generate secrets with scripts.bootstrap}
      WORKER_API_KEY: ${WORKER_API_KEY:?Generate secrets with scripts.bootstrap}
      PROVISIONING_SECRET_KEY: ${PROVISIONING_SECRET_KEY:?Generate secrets with scripts.bootstrap}
      VPN_GATEWAY_CERTIFICATE_DAYS: ${VPN_GATEWAY_CERTIFICATE_DAYS:-3650}
      VPN_TECHNICIAN_CERTIFICATE_DAYS: ${VPN_TECHNICIAN_CERTIFICATE_DAYS:-3650}
      PROVISIONING_DOWNLOAD_MINUTES: ${PROVISIONING_DOWNLOAD_MINUTES:-15}
      FACTORY_STATIONS: ${FACTORY_STATIONS:-{}}
      FACTORY_REQUESTS_PER_MINUTE: ${FACTORY_REQUESTS_PER_MINUTE:-60}
      ENROLLMENT_REQUESTS_PER_MINUTE: ${ENROLLMENT_REQUESTS_PER_MINUTE:-30}
      ENROLLMENT_PACKAGES_PER_HOUR: ${ENROLLMENT_PACKAGES_PER_HOUR:-6}
      OPENVPN_SERVER_HOST: ${OPENVPN_SERVER_HOST:?Set the public VPN endpoint}
      OPENVPN_SERVER_PORT: ${OPENVPN_SERVER_PORT:-1194}
      SMS_PROVIDER: ${SMS_PROVIDER:-generic}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:-}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-}
      PORTAL_SESSION_MINUTES: ${PORTAL_SESSION_MINUTES:-720}
      VPN_SESSION_MINUTES: ${VPN_SESSION_MINUTES:-180}
      VPN_LEASE_SECONDS: ${VPN_LEASE_SECONDS:-300}
      GATEWAY_POLL_INTERVAL: ${GATEWAY_POLL_INTERVAL:-5}
      GATEWAY_WIFI_CHECK_INTERVAL: ${GATEWAY_WIFI_CHECK_INTERVAL:-30}
      CONTROL_API_TIMEOUT_SECONDS: ${CONTROL_API_TIMEOUT_SECONDS:-10}
      GATEWAY_CONNECT_TIMEOUT_SECONDS: ${GATEWAY_CONNECT_TIMEOUT_SECONDS:-30}
      SSO_PROVIDERS: ${SSO_PROVIDERS:-{}}
      SSO_PUBLIC_URL: ${SSO_PUBLIC_URL:-}
      SSO_TOKEN_KEY: ${SSO_TOKEN_KEY:-}
      SSO_CLIENT_REDIRECT_URIS: ${SSO_CLIENT_REDIRECT_URIS:-["http://127.0.0.1:8765/callback"]}
      SSO_SESSION_MINUTES: ${SSO_SESSION_MINUTES:-720}
      SSO_CHECK_INTERVAL_SECONDS: ${SSO_CHECK_INTERVAL_SECONDS:-60}
      SSO_MAX_STALENESS_SECONDS: ${SSO_MAX_STALENESS_SECONDS:-120}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  provisioning-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        APP_NAME: ${APP_NAME-FactoryVPN}
    command: ["python", "-m", "scripts.provisioning_worker"]
    user: "${FACTORYVPN_UID:-1000}:${FACTORYVPN_GID:-1000}"
    # No exposed ports, Docker socket or network administration capabilities.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgresql+asyncpg://factoryvpn:${POSTGRES_PASSWORD}@db:5432/factoryvpn
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET}
      WORKER_API_KEY: ${WORKER_API_KEY}
      PROVISIONING_SECRET_KEY: ${PROVISIONING_SECRET_KEY}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:?Set the public portal HTTPS origin}
      OPENVPN_SERVER_HOST: ${OPENVPN_SERVER_HOST}
      OPENVPN_SERVER_PORT: ${OPENVPN_SERVER_PORT:-1194}
      FACTORYVPN_PKI_ROOT: /pki
      VPN_GATEWAY_CERTIFICATE_DAYS: ${VPN_GATEWAY_CERTIFICATE_DAYS:-3650}
      VPN_TECHNICIAN_CERTIFICATE_DAYS: ${VPN_TECHNICIAN_CERTIFICATE_DAYS:-3650}
      GATEWAY_POLL_INTERVAL: ${GATEWAY_POLL_INTERVAL:-5}
      GATEWAY_WIFI_CHECK_INTERVAL: ${GATEWAY_WIFI_CHECK_INTERVAL:-30}
      CONTROL_API_TIMEOUT_SECONDS: ${CONTROL_API_TIMEOUT_SECONDS:-10}
      GATEWAY_CONNECT_TIMEOUT_SECONDS: ${GATEWAY_CONNECT_TIMEOUT_SECONDS:-30}
      SSO_PROVIDERS: ${SSO_PROVIDERS:-{}}
      SSO_PUBLIC_URL: ${SSO_PUBLIC_URL:-}
      SSO_TOKEN_KEY: ${SSO_TOKEN_KEY:-}
      SSO_CLIENT_REDIRECT_URIS: ${SSO_CLIENT_REDIRECT_URIS:-["http://127.0.0.1:8765/callback"]}
      SSO_SESSION_MINUTES: ${SSO_SESSION_MINUTES:-720}
      SSO_CHECK_INTERVAL_SECONDS: ${SSO_CHECK_INTERVAL_SECONDS:-60}
      SSO_MAX_STALENESS_SECONDS: ${SSO_MAX_STALENESS_SECONDS:-120}
    volumes:
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/issuers:/pki/issuers:ro
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/pki-public:/pki/pki-public:ro
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/crls:/pki/crls
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/locks:/pki/locks
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/transport:/pki/transport:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: factoryvpn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate secrets with scripts.bootstrap}
      POSTGRES_DB: factoryvpn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoryvpn -d factoryvpn"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped

  openvpn:
    build:
      context: .
      dockerfile: docker/Dockerfile.network
      target: runtime
    command: ["python", "/etc/openvpn/entrypoint.py"]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    ports: ["${OPENVPN_SERVER_PORT:-1194}:1194/udp"]
    environment:
      OPENVPN_PING_SECONDS: ${OPENVPN_PING_SECONDS:-10}
      OPENVPN_RESTART_SECONDS: ${OPENVPN_RESTART_SECONDS:-300}
      API_URL: http://api:8000
      WORKER_API_KEY: ${WORKER_API_KEY:?Generate secrets with scripts.bootstrap}
    volumes:
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/server:/etc/openvpn/pki:ro
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/pki-public:/pki/pki-public:ro
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/crls:/pki/crls:ro
      - ${FACTORYVPN_RUNTIME_DIR:-./.runtime}/transport:/pki/transport:ro
      - openvpn_runtime:/run/openvpn
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  session-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.network
      target: runtime
    command: ["python", "-m", "session-worker.main"]
    # Gateway Only richiede soltanto il firewall nel namespace OpenVPN condiviso.
    cap_add: [NET_ADMIN]
    network_mode: service:openvpn
    environment:
      API_URL: http://api:8000
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5}
      CONTROL_API_TIMEOUT_SECONDS: ${CONTROL_API_TIMEOUT_SECONDS:-10}
      WORKER_API_KEY: ${WORKER_API_KEY:?Generate secrets with scripts.bootstrap}
    volumes:
      - openvpn_runtime:/run/openvpn
    depends_on:
      api:
        condition: service_healthy
      openvpn:
        condition: service_started
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  openvpn_runtime:

port 1194
proto udp
dev tun0
topology subnet
server 10.100.0.0 255.255.0.0 nopool
disable-dco
ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/server.crt
key /etc/openvpn/pki/server.key
dh none
tls-crypt /etc/openvpn/pki/tls-crypt.key
crl-verify /etc/openvpn/pki/crl.pem
tls-version-min 1.3
data-ciphers AES-256-GCM:AES-128-GCM
remote-cert-tls client
verify-client-cert require
keepalive 10 40
persist-key
persist-tun
management /run/openvpn/management.sock unix
management-client-user root
script-security 2
client-connect "/usr/local/bin/python /app/session-worker/openvpn_hooks.py connect"
learn-address "/usr/local/bin/python /app/session-worker/openvpn_hooks.py learn"
max-routes-per-client 1
verb 3
# Intentionally no client-to-client: every forwarded packet crosses the kernel firewall.

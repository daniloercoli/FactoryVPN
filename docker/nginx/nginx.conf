events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $uri $portal_cache_control {
        default "";
        ~^/app/assets/ "public, max-age=31536000, immutable";
        ~^/app(?:/|$) "no-store";
    }

    # Exclude query strings: OIDC callback and client handoff codes are credentials.
    log_format factoryvpn '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log factoryvpn;
    upstream api_backend {
        server api:8000;
    }

    # Rate limiting zone: 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;
        absolute_redirect off;

        # TLS 1.3
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control $portal_cache_control always;
        root /usr/share/nginx/html;

        # Body size limit
        client_max_body_size 1m;

        location = /api/v1/backups/import {
            limit_req zone=api_limit burst=2 nodelay;
            client_max_body_size 512m;
            client_body_timeout 60s;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/backups/[0-9a-f-]+/download$ {
            limit_req zone=api_limit burst=2 nodelay;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            access_log off;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend/health/ready;
        }

        location = / { return 302 /app/; }
        location = /app { return 302 /app/; }
        location /app/assets/ { try_files $uri =404; }
        location /app/ { try_files $uri /app/index.html; }
        location / { return 404; }
    }
}
